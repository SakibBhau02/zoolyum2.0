name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoolyum
          POSTGRES_PASSWORD: zoolyum_ci
          POSTGRES_DB: zoolyum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoolyum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://zoolyum:zoolyum_ci@localhost:5432/zoolyum
      ADMIN_PASSWORD: ci-only-not-a-real-password
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit (critical only)
        run: npm audit --audit-level=critical
